{{- if .Values.service.nexus.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.namespaces.nexusNs.name | quote }}
{{- if .Values.service.annotations }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
{{- end }}
  labels:
  {{- include "nexus.labels" . | nindent 4 }}
  {{- if .Values.nexus.extraLabels }}
    {{- with .Values.nexus.extraLabels }}
      {{ toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if .Values.service.nexus.labels }}
    {{- with .Values.service.nexus.labels }}
      {{ toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
    app.kubernetes.io/component: nexus
spec:
  type: {{ .Values.service.nexus.type }}
  selector:
    {{- include "nexus.selectorLabels" . | nindent 4 }}
    {{- if .Values.nexus.extraSelectorLabels }}
      {{- with .Values.nexus.extraSelectorLabels }}
        {{ toYaml . | nindent 4 }}
      {{- end }}
    {{- end }}
    app.kubernetes.io/component: nexus
  ports:
    - name: nexus-ui
      protocol: {{ .Values.service.nexus.protocol }}
      port: {{ .Values.service.nexus.port }}
      targetPort: {{ .Values.service.nexus.targetPort }}
{{- end }}
---
{{ if .Values.nexus.docker.enabled -}}
{{ range $registry := .Values.nexus.docker.registries }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" $ | trunc 49 }}-docker-{{ $registry.port }}
  namespace: {{ default $.Release.Namespace $.Values.namespaces.nexusNs.name | quote }}
  {{- if $.Values.service.annotations }}
  annotations:
    {{ toYaml $.Values.service.annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "nexus.labels" $ | nindent 4 }}
    {{- if $.Values.nexus.extraLabels }}
      {{- with $.Values.nexus.extraLabels }}
        {{ toYaml . | nindent 4 }}
      {{- end }}
    {{- end }}
    app.kubernetes.io/component: nexus
spec:
  type: {{ $.Values.nexus.docker.type }}
  selector:
    {{- include "nexus.selectorLabels" $ | nindent 4 }}
    {{- if $.Values.nexus.extraSelectorLabels }}
      {{- with $.Values.nexus.extraSelectorLabels }}
        {{ toYaml . | nindent 4 }}
      {{- end }}
    {{- end }}
    app.kubernetes.io/component: nexus
  ports:
    - name: docker-{{ $registry.port }}
      protocol: {{ $.Values.nexus.docker.protocol }}
      port: {{ $registry.port }}
      targetPort: {{ $registry.targetPort }}
---
{{ end }}
{{- end }}
---
{{- if .Values.service.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" . }}-nginx
  namespace: {{ default .Release.Namespace .Values.namespaces.nexusNs.name | quote }}
{{- if .Values.service.annotations }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
{{- end }}
  labels:
  {{- include "nexus.labels" . | nindent 4 }}
  {{- if .Values.nginx.extraLabels }}
    {{- with .Values.nginx.extraLabels }}
      {{ toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if .Values.service.nginx.labels }}
    {{- with .Values.service.nginx.labels }}
      {{ toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.service.nginx.type }}
  selector:
    {{- include "nexus.selectorLabels" . | nindent 4 }}
    {{- if .Values.nginx.extraSelectorLabels }}
      {{- with .Values.nginx.extraSelectorLabels }}
        {{ toYaml . | nindent 4 }}
      {{- end }}
    {{- end }}
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      protocol: {{ .Values.service.nginx.protocols.http }}
      port: {{ .Values.service.nginx.ports.http }}
      targetPort: {{ .Values.service.nginx.targetPorts.http }}
    {{- if .Values.nginx.tls.enabled }}
    - name: https
      protocol: {{ .Values.service.nginx.protocols.https }}
      port: {{ .Values.service.nginx.ports.https }}
      targetPort: {{ .Values.service.nginx.targetPorts.https }}
    {{- end }}
{{- end }}
